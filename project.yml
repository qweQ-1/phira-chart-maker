name: PhiraMaker
options:
  bundleIdPrefix: com.qweq-1
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  PhiraMaker:
    type: application
    platform: iOS
    sources:
      - path: PhiraMaker/Sources
      - path: PhiraMaker/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: PhiraMaker/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.qweq-1.phiramaker
        PRODUCT_NAME: PhiraMaker
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO
  PhiraMakerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhiraMakerTests
    dependencies:
      - target: PhiraMaker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qweq-1.phiramaker.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhiraMaker:
    build:
      targets:
        PhiraMaker: all
        PhiraMakerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhiraMakerTests
    archive:
      config: Release
